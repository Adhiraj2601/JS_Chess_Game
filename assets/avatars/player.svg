    <circle cx="43" cy="44" r="2.2" fill="#1a202c" />
    <circle cx="57" cy="44" r="2.2" fill="#1a202c" />
    <!-- Eyebrows -->
    <path d="M38 39 Q43 37 47 39" stroke="#1a202c" stroke-width="1.6" stroke-linecap="round" fill="none" />
    <path d="M53 39 Q57 37 62 39" stroke="#1a202c" stroke-width="1.6" stroke-linecap="round" fill="none" />
    <!-- Smile -->
    <path d="M44 54 Q50 59 56 54" stroke="#c05621" stroke-width="1.6" stroke-linecap="round" fill="none" />
  </g>
  <circle cx="50" cy="50" r="48" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2" />
