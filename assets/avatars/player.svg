    <linearGradient id="skin-play" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbd38d"/>
      <stop offset="100%" stop-color="#ed8936"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#circle-clip-play)">
