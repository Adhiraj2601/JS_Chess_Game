    <ellipse cx="50" cy="44" rx="18" ry="21" fill="url(#skin-play)" />
    <!-- Front Hair -->
    <path d="M28 42 C28 22 40 18 50 18 C62 18 72 22 72 42 C70 32 62 26 50 26 C38 26 30 32 28 42 Z" fill="#1a202c" />
    <path d="M28 38 C32 50 34 62 33 72 C31 62 30 52 28 38 Z" fill="#1a202c" />
