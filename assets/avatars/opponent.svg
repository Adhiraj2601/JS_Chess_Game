    <linearGradient id="skin-opp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbd38d"/>
      <stop offset="100%" stop-color="#f6ad55"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#circle-clip-opp)">
    <circle cx="50" cy="50" r="50" fill="url(#bg-opp)" />
    <!-- Shoulders / Shirt -->
    <path d="M15 95 C15 75 30 68 50 68 C70 68 85 75 85 95 Z" fill="#e2e8f0" />
    <path d="M42 68 L50 78 L58 68 Z" fill="#cbd5e0" />
