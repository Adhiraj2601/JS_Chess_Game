    <circle cx="43" cy="42" r="2.2" fill="#2d3748" />
    <circle cx="57" cy="42" r="2.2" fill="#2d3748" />
    <!-- Eyebrows -->
    <path d="M39 37 Q43 35 47 37" stroke="#744210" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <path d="M53 37 Q57 35 61 37" stroke="#744210" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <!-- Smile -->
