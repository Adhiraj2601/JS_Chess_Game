    <ellipse cx="50" cy="42" rx="19" ry="22" fill="url(#skin-opp)" />
    <!-- Hair -->
    <path d="M30 38 C30 22 42 16 54 18 C64 20 70 26 70 36 C66 32 60 30 52 30 C42 30 35 34 30 38 Z" fill="#744210" />
